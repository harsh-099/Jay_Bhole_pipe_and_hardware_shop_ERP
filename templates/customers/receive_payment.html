{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-header">

        <h4>

            Receive Payment

        </h4>

    </div>

    <div class="card-body">

        <h5>

            Customer :
            {{ customer.name }}

        </h5>

        <h5>

            Current Balance :
            ₹{{ customer.credit_balance }}

        </h5>

        <hr>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label>

                    Amount Received

                </label>

                <input
                    type="number"
                    step="0.01"
                    name="amount"
                    class="form-control"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-success"
            >

                Save Payment

            </button>

        </form>

    </div>

</div>

{% endblock %}

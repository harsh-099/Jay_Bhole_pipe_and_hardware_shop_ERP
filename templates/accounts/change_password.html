{% extends 'base.html' %}

{% block title %}Change Password{% endblock %}

{% block page_title %}
Change Password
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card shadow">

            <div class="card-header bg-info text-white">

                <h4>

                    <i class="fa fa-key"></i>

                    Change Password

                </h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-success">

                        <i class="fa fa-save"></i>

                        Update Password

                    </button>

                    <a href="{% url 'users' %}" class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-danger text-white">

        <h4>

            Add Expense

        </h4>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="category"
                class="form-control mb-3"
                placeholder="Expense Category">

            <input
                type="number"
                step="0.01"
                name="amount"
                class="form-control mb-3"
                placeholder="Amount">

            <textarea
                name="description"
                class="form-control mb-3"
                placeholder="Description"></textarea>

            <button
                class="btn btn-danger">

                Save Expense

            </button>

        </form>

    </div>

</div>

{% endblock %}
